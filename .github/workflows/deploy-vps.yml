name: Deploy to VPS on merge

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      G_SPONSORS: ${{ secrets.G_SPONSORS }}
      PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
      PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: yarn && yarn build && yarn export

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # -T caps how long ssh-keyscan waits, and "|| true" keeps a transient
          # network hiccup from failing the whole step (bash runs with -e here).
          # This is best-effort anyway: the rsync step below already uses
          # StrictHostKeyChecking=no, so a missing known_hosts entry is fine.
          ssh-keyscan -T 15 -p 2222 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test raw TCP connectivity to VPS
        run: |
          echo "Testing TCP connect to ${{ secrets.VPS_HOST }}:2222 ..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/2222" \
            && echo "OK: port 2222 reachable" \
            || echo "FAILED: port 2222 NOT reachable from this runner"

      - name: Deploy static export to VPS
        run: |
          set -x
          rsync -avvz --delete \
            -e "ssh -v -p 2222 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes" \
            out/ deploy@${{ secrets.VPS_HOST }}:
          echo "rsync exit code: $?"