name: Deploy to VPS on merge

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      G_SPONSORS: ${{ secrets.G_SPONSORS }}
      PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
      PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: yarn && yarn build && yarn export

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts || true

      # The deploy user on the VPS is restricted (via an rrsync command in
      # authorized_keys) to only rsync into /docker/heroic-website/data, so
      # the destination path after the colon is intentionally left empty.
      - name: Deploy static export to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            out/ deploy@${{ secrets.VPS_HOST }}: