name: Deploy to VPS on merge

# Hostinger blocks inbound SSH from GitHub Actions runner IP ranges (raw TCP
# to the VPS times out from runners on both port 22 and 2222, while the same
# ports are reachable from residential IPs). So instead of pushing over SSH,
# this workflow publishes the static export to the "deploy" branch, and the
# VPS pulls it from GitHub on a cron (outbound traffic is never blocked).
# See scripts/vps-pull-deploy.sh for the VPS side.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Nightly rebuild so sponsor data stays fresh
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    env:
      G_SPONSORS: ${{ secrets.G_SPONSORS }}
      PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
      PATREON_CAMPAIGN_ID: ${{ secrets.PATREON_CAMPAIGN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install && pnpm build && pnpm export

      - name: Publish static export to the deploy branch
        run: |
          cd out
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            deploy
